name: Build and Deploy to GKE

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: f1001473-mlops-week1
  GAR_LOCATION: us-central1
  GKE_CLUSTER: oppe2-cluster
  GKE_ZONE: us-central1-a
  REPOSITORY: oppe2-repo
  IMAGE: heart-disease-api

jobs:
  setup-build-publish-deploy:
    name: Setup, Build, Publish, and Deploy
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - id: 'auth'
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker Auth
      run: |-
        gcloud auth configure-docker $GAR_LOCATION-docker.pkg.dev

    - name: Build and Push Docker Image
      run: |-
        IMAGE_URI="$GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:${{ github.sha }}"
        docker build -t "$IMAGE_URI" .
        docker push "$IMAGE_URI"

    - name: Get GKE Credentials
      uses: google-github-actions/get-gke-credentials@v2
      with:
        cluster_name: ${{ env.GKE_CLUSTER }}
        location: ${{ env.GKE_ZONE }}

    - name: Deploy to GKE
      run: |-
        IMAGE_URI="$GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:${{ github.sha }}"
        sed -i "s|IMAGE_PLACEHOLDER|$IMAGE_URI|g" k8s/manifests.yaml
        kubectl apply -f k8s/manifests.yaml
        kubectl rollout status deployment/heart-api-deployment
